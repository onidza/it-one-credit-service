server:
  port: 8081

spring:
  application:
    name: credit-service

  datasource:
    url: jdbc:postgresql://localhost:5433/postgres
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  mail:
    host: ${SPRING_MAIL_HOST:smtp.mail.ru}
    port: ${SPRING_MAIL_PORT:465}
    username: ${SPRING_MAIL_USERNAME:it_one_smtp@mail.ru}
    password: ${SPRING_MAIL_PASSWORD:EEKslUqLi61bfmPsdbq2}

    ssl:
      enabled: true

    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.connectiontimeout]": 10000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000
      "[mail.debug]": true

  jpa:
    hibernate:
      ddl-auto: create-drop
    show_sql: true

    properties:
      hibernate:
        default_batch_fetch_size: 20
        jdbc:
          batch_size: 50

  grpc:
    server:
      port: 9091

logging:
  level:
    org.springframework.security: DEBUG

security:
  jwt:
    issuer: ${SECURITY_JWT_ISSUER:apigateway}
    secret: ${SECURITY_JWT_SECRET:McHowHFh9zfPUjAu6VdpgKm+zzOTzrpNmElKZana3RM=}

rest:
  loan-service:
    url: ${REST_LOAN_SERVICE_URL:http://localhost:8082}
    connect-timeout: 1s
    read-timeout: 3s

resilience4j:
  retry:
    instances:
      loanManagement:
        max-attempts: 3
        wait-duration: 500ms
        enable-randomized-wait: true
        randomized-wait-factor: 0.5

  circuitbreaker:
    instances:
      loanManagement:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true

s3:
  endpoint: http://localhost:9000
  access-key: admin
  secret-key: password123
  region: eu-central-1
  bucket: credit-files

file:
  presigned-url-ttl: 10m