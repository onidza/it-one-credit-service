services:
  postgres:
    image: 'postgres:18'
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres #.env
      POSTGRES_PASSWORD: postgres #.env

    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10

    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: